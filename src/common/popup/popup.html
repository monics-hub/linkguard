<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="../../icons/icon-32.png" alt="" width="24" height="24"><b>LinkGuard</b>

  </div>
  <script src="../../platform/platform.js"></script>
  <script src="../data/defaults.js"></script>
  <script src="../core/domain.js"></script>
  <script src="../core/settings.js"></script>
